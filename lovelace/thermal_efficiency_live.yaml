# Sections-view dashboard with real-time gauges, status fallback tiles, and trend charts.
# Generated from portable mapping configuration.

views:
- badges:
  - color: blue
    entity: sensor.thermal_efficiency_data_readiness
    icon: mdi:clipboard-check-outline
    name: Readiness
    show_icon: true
    show_name: true
    show_state: true
    visibility:
    - condition: state
      entity: sensor.thermal_efficiency_data_readiness
      state_not: unknown
    - condition: state
      entity: sensor.thermal_efficiency_data_readiness
      state_not: unavailable
  - color: purple
    entity: sensor.thermal_efficiency_heat_loss_coefficient
    icon: mdi:home-thermometer-outline
    name: Delivered HLC
    show_icon: true
    show_name: true
    show_state: true
    visibility:
    - condition: state
      entity: sensor.thermal_efficiency_heat_loss_coefficient
      state_not: unknown
    - condition: state
      entity: sensor.thermal_efficiency_heat_loss_coefficient
      state_not: unavailable
  - color: teal
    entity: sensor.thermal_efficiency_air_change_rate
    icon: mdi:weather-windy
    name: Air Changes
    show_icon: true
    show_name: true
    show_state: true
    visibility:
    - condition: state
      entity: sensor.thermal_efficiency_air_change_rate
      state_not: unknown
    - condition: state
      entity: sensor.thermal_efficiency_air_change_rate
      state_not: unavailable
  - color: amber
    entity: sensor.thermal_efficiency_loft_ratio
    icon: mdi:home-roof
    name: Loft Coupling
    show_icon: true
    show_name: true
    show_state: true
    visibility:
    - condition: state
      entity: sensor.thermal_efficiency_loft_ratio
      state_not: unknown
    - condition: state
      entity: sensor.thermal_efficiency_loft_ratio
      state_not: unavailable
  - color: blue
    entity: sensor.thermal_efficiency_electricity_baseload
    icon: mdi:power-plug-outline
    name: Baseload
    show_icon: true
    show_name: true
    show_state: true
    visibility:
    - condition: state
      entity: sensor.thermal_efficiency_electricity_baseload
      state_not: unknown
    - condition: state
      entity: sensor.thermal_efficiency_electricity_baseload
      state_not: unavailable
  - color: deep-orange
    entity: sensor.thermal_efficiency_space_heating_gas_7_day_average
    icon: mdi:radiator
    name: Space Heating
    show_icon: true
    show_name: true
    show_state: true
    visibility:
    - condition: state
      entity: sensor.thermal_efficiency_space_heating_gas_7_day_average
      state_not: unknown
    - condition: state
      entity: sensor.thermal_efficiency_space_heating_gas_7_day_average
      state_not: unavailable
  - color: light-blue
    entity: sensor.thermal_efficiency_hot_water_gas_7_day_average
    icon: mdi:shower-head
    name: Hot Water
    show_icon: true
    show_name: true
    show_state: true
    visibility:
    - condition: state
      entity: sensor.thermal_efficiency_hot_water_gas_7_day_average
      state_not: unknown
    - condition: state
      entity: sensor.thermal_efficiency_hot_water_gas_7_day_average
      state_not: unavailable
  dense_section_placement: true
  icon: mdi:home-thermometer
  max_columns: 3
  path: thermal-efficiency
  sections:
  - cards:
    - heading: Building Thermal Envelope
      heading_style: title
      icon: mdi:home-thermometer
      type: heading
    - type: markdown
      title: Data readiness and model scope
      content: >-
        {% set s = 'sensor.thermal_efficiency_data_readiness' %}
        {% set summary = state_attr(s, 'summary') %}
        {% set status = state_attr(s, 'hlc_status') %}
        {% set reason = state_attr(s, 'hlc_reason') %}
        {% set action = state_attr(s, 'hlc_next_action') %}
        **Readiness:** {{ states(s) | replace('_', ' ') | title }} · **HLC:** {{ status | default('collecting', true) | replace('_', ' ') | title }}
        {% if reason %} · **Reason:** {{ reason }}{% endif %}
        {% if action and action != 'None' %} · **Next:** {{ action }}{% endif %}
              {% if summary %} · {{ summary }}{% endif %}
        {% set hlc = state_attr(s, 'metrics') or {} %}{% set fit = hlc.get('hlc', {}) %}
        {% for metric, info in hlc.items() %}

        **{{ metric | replace('_', ' ') | title }}:** {{ info.get('status', 'collecting') | replace('_', ' ') }}. {{ info.get('reason', '') }} {{ info.get('next_action', '') }}
        {% if info.get('usable_observations') is not none %} Evidence: {{ info.get('usable_observations') }}/{{ info.get('required_observations', '—') }}.{% endif %}
        {% if info.get('model_data_through') %} Model through {{ info.get('model_data_through') }}.{% endif %}
        {% if info.get('source_lag_days') is not none %} Source lag: {{ info.get('source_lag_days') }} days.{% endif %}
        {% endfor %}
        {% if fit.get('usable_observations') is not none %} · HLC observations: **{{ fit.get('usable_observations') }}/{{ fit.get('required_observations', '—') }}** usable/required.{% endif %}
        {% set through = state_attr('sensor.thermal_efficiency_heat_loss_coefficient', 'model_data_through') %}
        {% set lag = state_attr('sensor.thermal_efficiency_heat_loss_coefficient', 'source_lag_days') %}
        {% set model_status = state_attr('sensor.thermal_efficiency_heat_loss_coefficient', 'status') %}
        {% if through %} · Model data through **{{ through }}**{% if lag is not none %} (source lag {{ lag }} days){% endif %}.{% endif %}
        {% if model_status == 'historical_baseline_held' %} Historical heating baseline held from its latest qualifying cold-season day.{% endif %}
        · Only complete local days are used; daylight-saving days may contain 23, 24 or 25 hours, and partial days are excluded.
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermal_efficiency_heat_loss_coefficient
        state_not: unknown
      - condition: state
        entity: sensor.thermal_efficiency_heat_loss_coefficient
        state_not: unavailable
      card:
        type: gauge
        entity: sensor.thermal_efficiency_heat_loss_coefficient
        name: Delivered HLC
        min: 0
        max: 500
        needle: true
        segments:
        - from: 0
          color: '#2e7d32'
        - from: 100
          color: '#7cb342'
        - from: 180
          color: '#f9a825'
        - from: 280
          color: '#ef6c00'
        - from: 400
          color: '#c62828'
      grid_options:
        columns: 6
        rows: 3
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermal_efficiency_heat_loss_coefficient
          state: unknown
        - condition: state
          entity: sensor.thermal_efficiency_heat_loss_coefficient
          state: unavailable
      card:
        type: tile
        entity: sensor.thermal_efficiency_heat_loss_coefficient
        name: Delivered HLC
        icon: mdi:home-thermometer-outline
        color: purple
        vertical: true
      grid_options:
        columns: 6
        rows: 3
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermal_efficiency_air_change_rate
        state_not: unknown
      - condition: state
        entity: sensor.thermal_efficiency_air_change_rate
        state_not: unavailable
      card:
        type: gauge
        entity: sensor.thermal_efficiency_air_change_rate
        name: "[EXPERIMENTAL] Air Infiltration"
        min: 0
        max: 1.5
        needle: true
        segments:
        - from: 0
          color: '#ef6c00'
        - from: 0.35
          color: '#2e7d32'
        - from: 0.7
          color: '#f9a825'
        - from: 1
          color: '#c62828'
      grid_options:
        columns: 6
        rows: 3
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermal_efficiency_air_change_rate
          state: unknown
        - condition: state
          entity: sensor.thermal_efficiency_air_change_rate
          state: unavailable
      card:
        type: tile
        entity: sensor.thermal_efficiency_air_change_rate
        name: "[EXPERIMENTAL] Air Infiltration"
        icon: mdi:weather-windy
        color: teal
        vertical: true
      grid_options:
        columns: 6
        rows: 3
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermal_efficiency_fabric_heat_loss
        state_not: unknown
      - condition: state
        entity: sensor.thermal_efficiency_fabric_heat_loss
        state_not: unavailable
      card:
        type: gauge
        entity: sensor.thermal_efficiency_fabric_heat_loss
        name: "[EXPERIMENTAL] Fabric Loss"
        min: 0
        max: 450
        needle: true
        segments:
        - from: 0
          color: '#2e7d32'
        - from: 100
          color: '#7cb342'
        - from: 180
          color: '#f9a825'
        - from: 280
          color: '#ef6c00'
        - from: 380
          color: '#c62828'
      grid_options:
        columns: 6
        rows: 3
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermal_efficiency_fabric_heat_loss
          state: unknown
        - condition: state
          entity: sensor.thermal_efficiency_fabric_heat_loss
          state: unavailable
      card:
        type: tile
        entity: sensor.thermal_efficiency_fabric_heat_loss
        name: "[EXPERIMENTAL] Fabric Loss"
        icon: mdi:wall
        color: deep-orange
        vertical: true
      grid_options:
        columns: 6
        rows: 3
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.thermal_efficiency_loft_ratio
        above: -1
        below: 2
      card:
        type: gauge
        entity: sensor.thermal_efficiency_loft_ratio
        name: Loft Coupling
        min: 0
        max: 1
        needle: true
        segments:
        - from: 0
          color: '#2e7d32'
        - from: 0.2
          color: '#f9a825'
        - from: 0.45
          color: '#c62828'
      grid_options:
        columns: 6
        rows: 3
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermal_efficiency_loft_ratio
          state: unknown
        - condition: state
          entity: sensor.thermal_efficiency_loft_ratio
          state: unavailable
      card:
        type: tile
        entity: sensor.thermal_efficiency_loft_ratio
        name: Loft Coupling
        icon: mdi:home-roof
        color: amber
        vertical: true
      grid_options:
        columns: 6
        rows: 3
    column_span: 1
    type: grid
  - cards:
    - heading: Room Cooling Fingerprints
      heading_style: title
      icon: mdi:fingerprint
      type: heading
    - config:
        displayModeBar: false
        responsive: true
      entities:
      - customdata: '$ex { const rawRooms = []; const getRows = () => rawRooms.map(([n, id]) => { const raw = hass.states[id]?.state; const isValid = raw !== undefined && raw !== null && String(raw).trim() !== "" && !["unknown", "unavailable", "none"].includes(String(raw).toLowerCase()); const nRaw = hass.states[id]?.attributes?.nights_fitted; const nValid = nRaw !== undefined && nRaw !== null && String(nRaw).trim() !== ""; return { name: n, value: isValid ? Number(raw) : NaN, nights: nValid ? (Number(nRaw) || 0) : 0 }; }).filter(r => Number.isFinite(r.value) && r.value > 0).sort((a, b) => b.value - a.value); return getRows().map(r => r.nights); }'
        entity: sensor.thermal_efficiency_heat_loss_coefficient
        hovertemplate: '<b>%{y}</b><br>Cooling time: <b>%{x:.1f} h</b><br>Fitted: %{customdata} nights<extra></extra>'
        marker:
          color: '$ex { const rawRooms = []; const getRows = () => rawRooms.map(([n, id]) => { const raw = hass.states[id]?.state; const isValid = raw !== undefined && raw !== null && String(raw).trim() !== "" && !["unknown", "unavailable", "none"].includes(String(raw).toLowerCase()); return { name: n, value: isValid ? Number(raw) : NaN }; }).filter(r => Number.isFinite(r.value) && r.value > 0).sort((a, b) => b.value - a.value); return getRows().map((r, i) => ["#2e7d32", "#689f38", "#fbc02d", "#f57c00", "#e64a19", "#d32f2f"][i % 6]); }'
          opacity: 0.88
        orientation: h
        textposition: auto
        texttemplate: '%{x:.1f} h'
        type: bar
        x: '$ex { const rawRooms = []; const getRows = () => rawRooms.map(([n, id]) => { const raw = hass.states[id]?.state; const isValid = raw !== undefined && raw !== null && String(raw).trim() !== "" && !["unknown", "unavailable", "none"].includes(String(raw).toLowerCase()); return { name: n, value: isValid ? Number(raw) : NaN }; }).filter(r => Number.isFinite(r.value) && r.value > 0).sort((a, b) => b.value - a.value); return getRows().map(r => r.value); }'
        y: '$ex { const rawRooms = []; const getRows = () => rawRooms.map(([n, id]) => { const raw = hass.states[id]?.state; const isValid = raw !== undefined && raw !== null && String(raw).trim() !== "" && !["unknown", "unavailable", "none"].includes(String(raw).toLowerCase()); return { name: n, value: isValid ? Number(raw) : NaN }; }).filter(r => Number.isFinite(r.value) && r.value > 0).sort((a, b) => b.value - a.value); return getRows().map(r => r.name); }'
      layout:
        bargap: 0.28
        font:
          color: $ex css_vars['primary-text-color']
        height: 390
        margin:
          b: 65
          l: 100
          r: 25
          t: 15
        paper_bgcolor: rgba(0,0,0,0)
        plot_bgcolor: rgba(0,0,0,0)
        xaxis:
          gridcolor: rgba(127,127,127,0.16)
          rangemode: tozero
          title:
            text: Cooling Time Constant τ (hours)
            standoff: 12
        yaxis:
          automargin: true
          autorange: reversed
      raw_plotly_config: true
      refresh_interval: auto
      type: custom:plotly-graph
    type: grid
  - cards:
    - heading: Long-Term Heat Loss Model
      heading_style: title
      icon: mdi:chart-bell-curve-cumulative
      type: heading
    - apex_config:
        chart:
          height: 310
        legend:
          fontSize: 12px
          position: top
        stroke:
          curve: smooth
          dashArray:
          - 0
          - 0
          - 4
        yaxis:
          decimalsInFloat: 0
          min: 0
          title:
            text: W/K
      graph_span: 365d
      header:
        colorize_states: true
        show: true
        show_states: true
        title: Delivered HLC & [EXPERIMENTAL] Loss Split (365 Days)
      series:
      - color: '#7e57c2'
        entity: sensor.thermal_efficiency_heat_loss_coefficient
        group_by:
          duration: 7d
          func: avg
        name: Total HLC
        opacity: 0.12
        stroke_width: 3
        type: area
        statistics:
          type: mean
          period: week
          align: middle
      - color: '#ef5350'
        entity: sensor.thermal_efficiency_fabric_heat_loss
        group_by:
          duration: 7d
          func: avg
        name: Fabric Loss (Experimental)
        stroke_width: 2.5
        type: line
        statistics:
          type: mean
          period: week
          align: middle
      - color: '#42a5f5'
        entity: sensor.thermal_efficiency_ventilation_heat_loss
        group_by:
          duration: 7d
          func: avg
        name: Ventilation Loss (Experimental)
        stroke_width: 2
        type: line
        statistics:
          type: mean
          period: week
          align: middle
      span:
        end: day
      type: custom:apexcharts-card
    column_span: 1
    type: grid
  - cards:
    - heading: Gas Consumption
      heading_style: title
      icon: mdi:meter-gas
      type: heading
    - color: blue
      entity: sensor.thermal_efficiency_hot_water_gas_7_day_average
      grid_options:
        columns: 6
        rows: 2
      icon: mdi:shower-head
      name: Hot Water (7d)
      tap_action:
        action: more-info
      type: tile
      vertical: true
    - color: deep-orange
      entity: sensor.thermal_efficiency_space_heating_gas_7_day_average
      grid_options:
        columns: 6
        rows: 2
      icon: mdi:radiator
      name: Space Heating (7d)
      tap_action:
        action: more-info
      type: tile
      vertical: true
    - apex_config:
        chart:
          height: 225
        legend:
          position: top
        stroke:
          curve: smooth
        yaxis:
          decimalsInFloat: 1
          min: 0
          title:
            text: kWh/day
      graph_span: 90d
      header:
        colorize_states: true
        show: true
        show_states: true
        title: Attributed Gas Use (90 Days)
      series:
      - color: '#42a5f5'
        entity: sensor.thermal_efficiency_hot_water_gas_7_day_average
        group_by:
          duration: 1d
          func: avg
        name: Hot Water
        opacity: 0.18
        stroke_width: 2
        type: area
        statistics:
          type: mean
          period: day
      - color: '#ef6c00'
        entity: sensor.thermal_efficiency_space_heating_gas_7_day_average
        group_by:
          duration: 1d
          func: avg
        name: Space Heating
        opacity: 0.14
        stroke_width: 2
        type: area
        statistics:
          type: mean
          period: day
      span:
        end: day
      type: custom:apexcharts-card
    type: grid
  - cards:
    - heading: Electricity & Baseload
      heading_style: title
      icon: mdi:transmission-tower-import
      type: heading
    - color: amber
      entity: sensor.thermal_efficiency_electricity_use_7_day_average
      grid_options:
        columns: 6
        rows: 2
      icon: mdi:flash
      name: Electricity (7d)
      tap_action:
        action: more-info
      type: tile
      vertical: true
    - color: blue
      entity: sensor.thermal_efficiency_electricity_baseload
      grid_options:
        columns: 6
        rows: 2
      icon: mdi:power-plug-outline
      name: Baseload (Always-on)
      tap_action:
        action: more-info
      type: tile
      vertical: true
    - apex_config:
        chart:
          height: 225
        stroke:
          curve: smooth
        yaxis:
          decimalsInFloat: 1
          min: 0
          title:
            text: kWh/day
      graph_span: 90d
      header:
        colorize_states: true
        show: true
        show_states: true
        title: Electricity Consumption (90 Days)
      series:
      - color: '#f9a825'
        entity: sensor.thermal_efficiency_electricity_use_7_day_average
        group_by:
          duration: 1d
          func: avg
        name: Daily Electricity
        opacity: 0.2
        stroke_width: 2
        type: area
        statistics:
          type: mean
          period: day
      span:
        end: day
      type: custom:apexcharts-card
    type: grid
  - cards:
    - heading: Water Consumption
      heading_style: title
      icon: mdi:water
      type: heading
    - color: teal
      entity: sensor.thermal_efficiency_total_water_use_7_day_average
      grid_options:
        columns: 12
        rows: 2
      icon: mdi:water-outline
      name: Water Avg (7d)
      tap_action:
        action: more-info
      type: tile
      vertical: true
    - apex_config:
        chart:
          height: 225
        stroke:
          curve: smooth
        yaxis:
          decimalsInFloat: 0
          min: 0
          title:
            text: L/day
      graph_span: 90d
      header:
        colorize_states: true
        show: true
        show_states: true
        title: Total Water Trend (90 Days)
      series:
      - color: '#00acc1'
        entity: sensor.thermal_efficiency_total_water_use_7_day_average
        group_by:
          duration: 1d
          func: avg
        name: Water (7d avg)
        opacity: 0.18
        stroke_width: 2
        type: area
        statistics:
          type: mean
          period: day
      span:
        end: day
      type: custom:apexcharts-card
    type: grid
  title: Thermal efficiency
