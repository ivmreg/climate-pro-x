# Map your HA entities here. `discover` generates a draft of this file.

# Boiler rated output in kW (use the value from your appliance documentation).
# Used only by the optional CLI estimate when no gas meter is mapped.
boiler_output_kw: null

# Optional: cumulative gas energy sensor (kWh), selected from your HA entity
# registry. Leave null until you have verified a compatible source.
gas_kwh_entity: null

# Optional: GBP/kWh gas tariff sensor and your combi's efficiency (0-1) —
# used by the `dhw` command to cost the hot-water gas baseline.
gas_unit_rate_entity: null
boiler_efficiency: 0.88

# Optional: enables the `ventilation` command (ventilation vs fabric split
# of the delivered HLC). co2_entity needs a real CO2 sensor with a season of
# history; floor_area_m2 is also used here (not just for HLC/m2 below).
co2_entity: null
# Additional indoor sensors are fitted independently; the median valid ACH is
# used so a single atypical room does not control the estimate.
co2_entities: []
# Optional measured/assumed outdoor baseline. When omitted, the lowest indoor
# observations are used as a noisier fallback.
outdoor_co2_ppm: null
outdoor_co2_entity: null
floor_area_m2: null
ceiling_height_m: null

# Optional: an external statistic id (not a sensor.* entity — check HA's
# Developer Tools > Statistics) with genuine hourly water usage. It excludes low-water away days from the DHW
# baseline, models heating-day DHW from actual usage, and also enables the
# informational hot-water-fraction regression. A recorder-tracked sensor.*
# meter that only updates once/day will NOT work here — diffing it gives one
# large daily spike, not real hourly usage.
water_stat: null
# Set 0 to disable away-day filtering while retaining water-based attribution.
min_dhw_water_litres: 50

outdoor_entity: null  # replace with a verified outdoor temperature entity
loft_entity: null     # replace with a verified loft temperature entity
weather_entity: null  # optional; used for wind/solar corrections

# The HA integration (custom_components/thermal_efficiency) additionally
# supports loft_since (ignore a relocated loft sensor's pre-move history)
# and loft_humidity (informational attribute). See README's "Home Assistant
# integration" section — this offline toolkit's config.yaml doesn't read
# those two keys, though it does now read floor_area_m2 (see above).

# Night window used for cooling-curve fits (heating normally off/setback).
night_start: "23:30"
night_end: "06:30"

rooms:
  living_room:
    temperature: null  # replace with a verified room temperature entity
    heating_power: null  # optional verified 0-100% heating demand entity
  bedroom:
    temperature: null
    heating_power: null
