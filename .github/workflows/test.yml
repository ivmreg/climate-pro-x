name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Exercise both the older supported core and the current HA runtime.
        include:
          - python-version: "3.13"
            ha-version: "2026.2.3"
          - python-version: "3.14"
            ha-version: "2026.9.1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install homeassistant==${{ matrix.ha-version }}
      - name: Run tests
        run: python -m pytest --cov-report=json:coverage.json --junitxml=pytest.xml
      - name: Enforce live core branch and combined coverage gate
        run: python scripts/check_coverage.py --report coverage.json
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.json
            pytest.xml
          if-no-files-found: warn
