name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Exercise both the older supported core and the current HA runtime.
        include:
          - python-version: "3.13"
            ha-version: "2026.2.3"
          - python-version: "3.14"
            ha-version: "2026.9.1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install homeassistant==${{ matrix.ha-version }}
      - name: Run tests
        run: python -m pytest
      - name: Enforce live core branch coverage
        run: >-
          python -m coverage report
          --include='custom_components/thermal_efficiency/thermal_math.py'
          --fail-under=90
